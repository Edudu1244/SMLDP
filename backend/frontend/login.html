<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMLDP | Login</title>
    <meta name="description" content="Entre na sua conta SMLDP para simular sua mudança de país.">
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <!-- Vinculado diretamente ao login.css -->
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="login.css?v=1.2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <button id="themeToggle" class="theme-toggle-floating" title="Alternar tema">🌙</button>

    <section class="login">
        <div class="login-box">
            <a href="inicial.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Voltar</a>

            <div class="logo"><i class="fa-solid fa-earth-americas"></i></div>

            <h1>Bem-vindo ao SMLDP</h1>
            <p class="subtitle">Entre na sua conta para continuar</p>

            <div class="sessao-ativa" id="sessaoAtiva" style="display:none;">
                <i class="fa-solid fa-circle-user"></i>
                <div class="sessao-ativa-texto">
                    <p>Este navegador já está logado como <strong id="sessaoAtivaNome"></strong> (<span id="sessaoAtivaEmail"></span>).</p>
                    <button type="button" id="btnSairSessaoAtiva">Sair e entrar com outra conta</button>
                </div>
            </div>

            <form id="formLogin">
                <div class="input-group">
                    <label for="email">Email</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="Digite seu email" required autocomplete="email">
                    </div>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="senha" placeholder="Digite sua senha" required autocomplete="current-password">
                    </div>
                </div>

                <button type="submit" id="btnLogin">Entrar</button>
            </form>

            <div class="register-link">
                <div class="forgot-password">
                    <a href="#" id="linkEsqueciSenha">Esqueci minha senha</a>
                </div>
                <p>
                    Não possui conta? <a href="cadastro.html">Criar conta</a>
                </p>
            </div>

            <p id="mensagem"></p>
        </div>
    </section>

    <!-- Modal: Esqueci minha senha -->
    <div class="modal-overlay" id="modalEsqueciSenha">
        <div class="modal-box">
            <button class="modal-fechar" id="btnFecharModalEsqueciSenha" title="Fechar">✕</button>

            <div class="modal-icone"><i class="fa-solid fa-key"></i></div>

            <h2>Esqueceu sua senha?</h2>
            <p class="modal-subtitulo">Informe seu e-mail e enviaremos um link para você criar uma nova senha.</p>

            <input type="email" id="inputEmailRecuperacao" class="modal-input" placeholder="Digite seu email" autocomplete="email">
            <p class="modal-erro" id="modalEsqueciSenhaErro"></p>
            <a href="#" id="linkRecuperacaoDev" class="link-recuperacao-dev" style="display:none;" target="_blank" rel="noopener">
                <i class="fa-solid fa-arrow-up-right-from-square"></i> Abrir link de redefinição
            </a>

            <div class="modal-acoes">
                <button class="modal-btn-cancelar" id="btnCancelarEsqueciSenha">Cancelar</button>
                <button class="modal-btn-salvar" id="btnEnviarRecuperacao">Enviar link</button>
            </div>
        </div>
    </div>

    <script src="theme.js"></script>
    <script src="login.js"></script>
</body>
</html>
