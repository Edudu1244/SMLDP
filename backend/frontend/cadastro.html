<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMLDP | Criar Conta</title>
    <meta name="description" content="Crie sua conta gratuita no SMLDP e comece a planejar sua mudança de país.">
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="cadastro.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <button id="themeToggle" class="theme-toggle-floating" title="Alternar tema">🌙</button>

    <section class="cadastro">
        <div class="cadastro-box">
            <a href="login.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Voltar para o Login</a>

            <div class="logo"><i class="fa-solid fa-earth-americas"></i></div>

            <h1>Crie sua Conta</h1>
            <p>Preencha os dados abaixo para começar a simular</p>

            <div class="sessao-ativa" id="sessaoAtiva" style="display:none;">
                <i class="fa-solid fa-circle-user"></i>
                <div class="sessao-ativa-texto">
                    <p>Este navegador já está logado como <strong id="sessaoAtivaNome"></strong> (<span id="sessaoAtivaEmail"></span>).</p>
                    <button type="button" id="btnSairSessaoAtiva">Sair e criar outra conta</button>
                </div>
            </div>

            <form id="formCadastro">
                <div class="input-group">
                    <label for="nome">Nome Completo</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-user"></i>
                        <input type="text" id="nome" placeholder="Digite seu nome" required>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="idade">Idade</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-calendar-days"></i>
                            <input type="number" id="idade" min="1" max="120" placeholder="Ex: 25" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="sexo">Sexo</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-venus-mars"></i>
                            <select id="sexo" required>
                                <option value="" disabled selected>Selecione</option>
                                <option value="Masculino">Masculino</option>
                                <option value="Feminino">Feminino</option>
                                <option value="Outro">Outro</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="input-row">
                    <div class="input-group">
                        <label for="profissao">Profissão</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-briefcase"></i>
                            <input type="text" id="profissao" placeholder="Ex: Desenvolvedor" required>
                        </div>
                    </div>
                    <div class="input-group">
                        <label for="paisAtual">País Atual</label>
                        <div class="input-wrap">
                            <i class="fa-solid fa-earth-americas"></i>
                            <select id="paisAtual" required>
                                <option value="" disabled selected>Carregando...</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="input-group">
                    <label for="email">Email</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-envelope"></i>
                        <input type="email" id="email" placeholder="Digite seu melhor email" required>
                    </div>
                </div>

                <div class="input-group">
                    <label for="senha">Senha</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="senha" placeholder="Crie uma senha segura" required>
                    </div>
                </div>

                <button type="submit" id="btnCadastrar">Cadastrar</button>
            </form>

            <div class="register-link">
                <p>
                    Já tem uma conta? <a href="login.html">Fazer Login</a>
                </p>
            </div>

            <p id="mensagem"></p>
        </div>
    </section>

    <script src="theme.js"></script>
    <script src="cadastro.js"></script>
</body>
</html>
