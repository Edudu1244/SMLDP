<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMLDP | Planeje sua Mudança</title>
    <meta name="description" content="Escolha o estado e a cidade de destino, com pontos fortes e fracos de cada um.">
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="simulacao.css">
    <link rel="stylesheet" href="planeje.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="panel-container">
        <aside class="sidebar">
            <div class="logo-panel"><i class="fa-solid fa-earth-americas brand-mark"></i> SMLDP</div>
            <p class="welcome-msg">Olá, <span id="nomeUsuario">Usuário</span>!</p>

            <div class="pais-atual-card">
                <span class="pais-atual-label">País escolhido</span>
                <strong class="pais-atual-nome" id="paisAtualNome">--</strong>
                <a href="simulacao.html" class="pais-atual-trocar"><i class="fa-solid fa-rotate"></i> Trocar país</a>
            </div>

            <a href="inicial.html" class="btn-sair-simulador"><i class="fa-solid fa-arrow-right-from-bracket"></i> Voltar</a>
        </aside>

        <main class="main-content">
            <header class="content-header">
                <div>
                    <h2><i class="fa-solid fa-suitcase-rolling"></i> Planeje sua Mudança</h2>
                    <p>Escolha o estado e a cidade de destino e preencha os detalhes do seu plano.</p>
                </div>
                <button id="themeToggle" title="Alternar tema">🌙</button>
            </header>

            <section class="plano-section">
                <div class="input-group">
                    <label>Estado / Região <span class="dica-campo">(os 4 com melhor economia, saúde e empregos)</span></label>
                    <div class="estados-grid-fortes" id="estadosGrid"></div>
                    <input type="hidden" id="planoEstado">
                </div>

                <div class="input-group" id="grupoCidades" style="display: none;">
                    <label>Cidade <span class="dica-campo">(as 2 melhores do estado escolhido)</span></label>
                    <div class="cidades-grid-fortes" id="cidadesGrid"></div>
                    <input type="hidden" id="planoCidade">
                </div>

                <div class="plano-grid">
                    <div class="input-group">
                        <label for="planoData">Quando pretende ir</label>
                        <input type="date" id="planoData">
                    </div>

                    <div class="input-group">
                        <label for="planoPessoas">Quantas pessoas</label>
                        <input type="number" id="planoPessoas" min="1" placeholder="Ex: 2">
                    </div>

                    <div class="input-group">
                        <label for="planoValorGuardado">Valor já guardado (R$)</label>
                        <input type="number" id="planoValorGuardado" min="0" step="0.01" placeholder="Ex: 15000">
                    </div>
                </div>

                <button type="button" id="btnSalvarPlano"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
                <p id="msgPlano"></p>
            </section>
        </main>
    </div>

    <script src="theme.js"></script>
    <script src="dadosPaises.js"></script>
    <script src="planeje.js"></script>
</body>
</html>
