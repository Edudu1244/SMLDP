<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMLDP | Redefinir Senha</title>
    <meta name="description" content="Crie uma nova senha para sua conta SMLDP.">
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="login.css?v=1.2">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <button id="themeToggle" class="theme-toggle-floating" title="Alternar tema">🌙</button>

    <section class="login">
        <div class="login-box">
            <a href="login.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Voltar para o Login</a>

            <div class="logo"><i class="fa-solid fa-key"></i></div>

            <h1>Criar nova senha</h1>
            <p class="subtitle">Escolha uma nova senha para sua conta</p>

            <form id="formRedefinirSenha">
                <div class="input-group">
                    <label for="novaSenha">Nova senha</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="novaSenha" placeholder="Digite a nova senha" required autocomplete="new-password" minlength="6">
                    </div>
                </div>

                <div class="input-group">
                    <label for="confirmarSenha">Confirmar senha</label>
                    <div class="input-wrap">
                        <i class="fa-solid fa-lock"></i>
                        <input type="password" id="confirmarSenha" placeholder="Digite a senha novamente" required autocomplete="new-password" minlength="6">
                    </div>
                </div>

                <button type="submit" id="btnRedefinirSenha">Redefinir senha</button>
            </form>

            <p id="mensagem"></p>
        </div>
    </section>

    <script src="theme.js"></script>
    <script src="redefinir-senha.js"></script>
</body>
</html>
