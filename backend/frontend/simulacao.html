<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMLDP | Simulador</title>
    <meta name="description" content="Simule índice de desenvolvimento, salário e qualidade de vida no país de destino escolhido.">
    <link rel="icon" type="image/svg+xml" href="img/logo.svg">
    <link rel="stylesheet" href="theme.css">
    <link rel="stylesheet" href="simulacao.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css">
</head>

<body>

    <div class="panel-container">
        <aside class="sidebar">
            <div class="logo-panel"><i class="fa-solid fa-earth-americas brand-mark"></i> SMLDP</div>
            <p class="welcome-msg">Olá, <span id="nomeUsuario">Usuário</span>!</p>

            <form id="formSimulacao">
                <div class="input-group">
                    <label for="paisDestino">País de Destino</label>
                    <select id="paisDestino" required>
                        <option value="" disabled selected>Selecione um país</option>
                        <option value="Estados Unidos">Estados Unidos</option>
                        <option value="China">China</option>
                        <option value="Japão">Japão</option>
                        <option value="Portugal">Portugal</option>
                        <option value="França">França</option>
                        <option value="Coreia do Sul">Coreia do Sul</option>
                        <option value="Suíça">Suíça</option>
                    </select>
                </div>
                <button type="submit" id="btnSimular"><i class="fa-solid fa-magnifying-glass"></i> Buscar Dados</button>
                <button type="button" id="btnProsseguir" class="btn-prosseguir" style="display: none;"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
                <a href="inicial.html" class="btn-sair-simulador"><i class="fa-solid fa-arrow-right-from-bracket"></i> Voltar</a>
            </form>

        </aside>

        <main class="main-content">
            <header class="content-header">
                <div>
                    <h2><i class="fa-solid fa-magnifying-glass-chart"></i> Painel de Simulação</h2>
                    <p>Selecione um país ao lado para carregar os dados atualizados do banco de dados.</p>
                </div>
                <button id="themeToggle" title="Alternar tema">🌙</button>
            </header>

            <div class="dashboard-grid">
                <div class="score-box">
                    <h3>Índice de Recomendação</h3>
                    <h2 id="resScore">--</h2>
                </div>

                <div class="details-grid">
                    <div class="result-card">
                        <div class="card-icon"><i class="fa-solid fa-chart-line"></i></div>
                        <div>
                            <p class="card-label">Índice de Desenvolvimento</p>
                            <strong id="resDesenvolvimento">--</strong>
                        </div>
                    </div>

                    <div class="result-card">
                        <div class="card-icon"><i class="fa-solid fa-briefcase"></i></div>
                        <div>
                            <p class="card-label">Salário Médio (mensal)</p>
                            <strong id="resSalario">--</strong>
                        </div>
                    </div>

                    <div class="result-card">
                        <div class="card-icon"><i class="fa-solid fa-heart-pulse"></i></div>
                        <div>
                            <p class="card-label">Saúde</p>
                            <strong id="resSaude">--</strong>
                        </div>
                    </div>

                    <div class="result-card">
                        <div class="card-icon"><i class="fa-solid fa-passport"></i></div>
                        <div>
                            <p class="card-label">Dificuldade de Migração</p>
                            <strong id="resMigracao">--</strong>
                        </div>
                    </div>

                    <div class="result-card">
                        <div class="card-icon"><i class="fa-solid fa-comments"></i></div>
                        <div>
                            <p class="card-label">Idioma</p>
                            <strong id="resIdioma">--</strong>
                        </div>
                    </div>

                    <div class="result-card">
                        <div class="card-icon"><i class="fa-solid fa-temperature-half"></i></div>
                        <div>
                            <p class="card-label">Clima</p>
                            <strong id="resClima">--</strong>
                        </div>
                    </div>
                </div>
            </div>

            <p id="msgStatus"></p>
        </main>
    </div>

    <script src="theme.js"></script>
    <script src="simulacao.js"></script>
</body>
</html>
